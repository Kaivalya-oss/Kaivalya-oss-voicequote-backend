version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dealership_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dealership_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealership_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dealership_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Two-Wheeler Dealership Sales Automation & Lead Management
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/dealership_db
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/dealership_db
      - JWT_SECRET_KEY=production_secure_secret_key_dealership_super_secret_9988
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - FRONTEND_URL=http://localhost:3000,http://localhost:5173
      - WHATSAPP_ACCESS_TOKEN=
      - WHATSAPP_PHONE_NUMBER_ID=
      - WHATSAPP_API_VERSION=v18.0
      - GEMINI_API_KEY=
      - UPLOAD_DIR=uploads
      - PDF_STORAGE_DIR=generated_pdfs
    volumes:
      - pdf_data:/app/generated_pdfs
      - uploads_data:/app/uploads

volumes:
  pgdata:
  pdf_data:
  uploads_data:
